  <rect x="24" y="436" width="512" height="64" rx="10" fill="#ffffff" stroke="#181d1a" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="280" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#181d1a">localStorage</text>
