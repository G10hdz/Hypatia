  <rect x="284" y="164" width="132" height="64" rx="10" fill="#ffffff" stroke="#181d1a" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="350" y="194" text-anchor="middle" font-size="20" font-weight="700" fill="#181d1a">SAA-C03</text>
