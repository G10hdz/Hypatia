  <rect x="384" y="304" width="130" height="68" rx="10" fill="rgba(180,83,9,0.08)" stroke="#b45309" stroke-width="1.5"/>
  <text x="449" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#181d1a">fsrs.js</text>
