  <!-- eyebrow -->
  <text x="28" y="38" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#7a837d">HYPATIA · STATIC SITE · NO BUILD</text>

  <!-- edges: hub fan -->
