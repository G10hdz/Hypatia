  <text x="70" y="214" text-anchor="middle" font-size="15" fill="#4d5650">UNAM Area 1</text>

  <rect x="144" y="164" width="132" height="64" rx="10" fill="#ffffff" stroke="#181d1a" stroke-opacity="0.35" stroke-width="1.5"/>
